<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>Clique abaixo</h1>
    <a href="#" onclick="clicou()">Clique em mim</a>
    <div id="saida">

    </div>

    <script>
        function clicou() {
            var s = document.querySelector('#saida')
            s.innerHTML += '<p>Você clicou!</p>'
        }
    </script>
</body>
</html>
